on:
  push:
  pull_request:
name: Test
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev gnupg
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 gnupg
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: make test
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix=$(brew --prefix openssl@3)
          CPPFLAGS="-I$prefix/include" LDFLAGS="-L$prefix/lib" make test
  windows:
    name: Build (windows)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
      - name: Build binary
        shell: msys2 {0}
        # Link statically, as the release workflow does.  Git for Windows runs
        # filters with its own DLLs first on PATH, which a dynamically linked
        # git-crypt.exe would load instead of MSYS2's.
        env:
          LDFLAGS: -static-libstdc++ -static
        run: make
      - name: Smoke test
        shell: msys2 {0}
        run: ./git-crypt.exe version
      - name: Integration scenarios
        shell: msys2 {0}
        # Use Git for Windows, as git-crypt.exe users do.  MSYS2's git prints
        # POSIX paths (e.g. /tmp/...), which a native program can't open.
        run: |
          export PATH="/c/Program Files/Git/cmd:$PATH"
          git --version
          ./tests/run.sh
