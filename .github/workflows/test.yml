name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y libssl-dev
      - name: Run tests
        run: make test
